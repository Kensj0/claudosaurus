name: Lägg in repon från Discord

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 repo_sync.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GUILD_ID: ${{ vars.GUILD_ID }}
          INBOX_CHANNEL_ID: ${{ vars.INBOX_CHANNEL_ID }}
          FORUM_CHANNEL_ID: ${{ vars.FORUM_CHANNEL_ID }}
          MAX_PER_USER_LINK: ${{ vars.MAX_PER_USER_LINK }}
