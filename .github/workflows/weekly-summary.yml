name: Veckosammanfattning

on:
  schedule:
    - cron: '0 6 * * 1'   # måndagar 06:00 UTC (08:00 sommartid, 07:00 vintertid)
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        group: [ai, jarri]
    steps:
      - uses: actions/checkout@v4
      - run: python3 weekly_summary.py --group ${{ matrix.group }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
